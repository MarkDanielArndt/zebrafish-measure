[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-measure"
version = "0.2.0"
description = "Segmentation, measurement, and scale-bar calibration functions for zebrafish larvae images"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mark Daniel Arndt", email = "markdaniel.arndt@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "scipy",
    "scikit-image",
    "matplotlib",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "segmentation-models-pytorch>=0.4.0",
    "huggingface_hub",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/MarkDanielArndt/zebrafish-measure"
Repository = "https://github.com/MarkDanielArndt/zebrafish-measure"
Issues = "https://github.com/MarkDanielArndt/zebrafish-measure/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zebrafish_measure = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
